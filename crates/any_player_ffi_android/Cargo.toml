[package]
name = "any_player_ffi_android"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
any_player_core = { path = "../any_player_core" }
android_logger = "0.15"
jni = { version = "0.21", features = ["default"] }
log = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
url = "2"
